version: '3.8'

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.220.0.0/16

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-web:${CRM_VERSION:-latest}  # Supports dynamic version tag upgrades & rollbacks
    container_name: crm-web
    ports:
      - "8201:8201"
    env_file:
      - .env
    restart: always
