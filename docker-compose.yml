version: '3.8'

networks:
  default:
    name: crm_shared_network
    external: true

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    image: crm-web:${CRM_VERSION:-latest}  # Supports dynamic version tag upgrades & rollbacks
    container_name: crm-web
    ports:
      - "8201:8201"
    env_file:
      - .env
    restart: always
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && npm run start"]
