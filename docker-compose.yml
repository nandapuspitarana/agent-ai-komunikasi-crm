version: '3.8'

networks:
  default:
    name: crm_shared_network
    external: true

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CRM_VERSION: ${CRM_VERSION:-}
        APP_COMMIT: ${APP_COMMIT:-}
        APP_BUILT_AT: ${APP_BUILT_AT:-}
    image: crm-web:${CRM_VERSION:-latest}  # Supports dynamic version tag upgrades & rollbacks
    container_name: crm-web
    ports:
      - "8201:8201"
    env_file:
      - .env
    environment:
      # Flow + knowledge base baked into the image are loaded into the database on every start
      # (scripts/docker/sync-knowledge.js). Only changed content is rewritten.
      KB_SYNC: ${KB_SYNC:-true}                    # "false" to skip
      KB_TENANT_ID: ${KB_TENANT_ID:-}              # tenant id(s), comma separated, or "all". Required when several tenants exist
      KB_ACTIVATE_FLOW: ${KB_ACTIVATE_FLOW:-true}  # true = on first creation, force = every start, false = never
      KB_ALIGN_LANGUAGE: ${KB_ALIGN_LANGUAGE:-true}  # tenant language follows the active flow's language (en)
    restart: always
    command: ["sh", "-c", "npx prisma db push --accept-data-loss && { node scripts/docker/sync-knowledge.js || echo '[sync-knowledge] failed, continuing without knowledge sync'; } && npm run start"]
