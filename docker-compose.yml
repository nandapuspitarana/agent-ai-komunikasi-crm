version: '3.8'

services:
  postgres:
    image: postgres:15.6-alpine  # Pinned to specific minor version to prevent unintended updates
    container_name: crm-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: crm
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine  # Pinned to specific minor version to prevent unintended updates
    container_name: crm-redis
    ports:
      - "5448:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-web:${CRM_VERSION:-latest}  # Supports dynamic version tag upgrades & rollbacks
    container_name: crm-web
    ports:
      - "3101:3101"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

volumes:
  postgres_data:
