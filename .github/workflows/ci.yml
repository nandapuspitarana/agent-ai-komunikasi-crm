name: CI

# Works on GitHub Actions and Gitea Actions (both read .github/workflows or .gitea/workflows).
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: CRM Web - Type-check, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Route handlers are type-checked against the generated Prisma client.
      # generate does not connect to a database; the URL only has to parse.
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npm run test:api

      - name: Build Next.js & SDK Package
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          CRM_VERSION: ${{ github.sha }}

  sdk:
    name: Flutter SDK - analyze & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/flutter_ai_agent_sdk
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test
